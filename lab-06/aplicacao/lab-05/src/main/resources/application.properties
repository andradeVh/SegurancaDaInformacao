spring.application.name=seg
# -------------------------------------------- #
# Configurações para uso do HashiCorp Vault
# -------------------------------------------- #
spring.config.import=vault://
spring.cloud.vault.fail-fast=true
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://vault-server:8200
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role=seg-role
spring.cloud.vault.app-role.role-path=approle
spring.cloud.vault.app-role.role-id=seg-role-id
# As credenciais do HashiCorp Vault estão armazenadas no arquivo .env
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.version=2
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=seg
# -------------------------------------------- #


# -------------------------------------------- #
# Configurações para uso do GitHub OAuth2
# -------------------------------------------- #
spring.security.oauth2.client.registration.github.client-name=Laboratorio de Autorizacao
spring.security.oauth2.client.registration.github.scope[0]=user,repo